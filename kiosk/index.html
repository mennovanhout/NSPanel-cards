<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>NSPanel</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0b0d10;
    color: #f2f4f7;
    font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
  }

  /* ---- the pager ----------------------------------------------------
     Deliberately not a JS gesture. The cards already declare
     touch-action: pan-x and hand any horizontal-first drag straight back,
     so a native scroll-snap container picks it up and the browser pans on
     the compositor - no script runs during a swipe at all. That is both
     smoother than a JS pager and the thing the cards were written for. */
  .pager {
    position: fixed;
    inset: 0;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
  }
  .pager::-webkit-scrollbar { display: none; }

  .page {
    flex: 0 0 100%;
    width: 100%;
    height: 100%;
    scroll-snap-align: center;
    scroll-snap-stop: always;
    box-sizing: border-box;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow: hidden;
  }
  /* leave room for the dots when there is more than one page */
  body.paged .page { padding-bottom: 26px; }

  .dots {
    position: fixed;
    left: 0; right: 0; bottom: 7px;
    display: flex;
    justify-content: center;
    gap: 7px;
    pointer-events: none;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,.22);
    /* opacity and transform only - the budget applies here too */
    transition: opacity .15s linear, transform .15s ease-out;
  }
  .dot.on { background: #f2f4f7; transform: scale(1.15); }

  /* ---- connection + errors ---- */
  .conn {
    position: fixed;
    top: 6px; right: 8px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #8ddba4;
    opacity: 0;
    transition: opacity .2s linear;
    pointer-events: none;
    z-index: 5;
  }
  .conn.warn { background: #f0a03c; opacity: 1; }
  .conn.bad { background: #f87171; opacity: 1; }

  .broken {
    border-radius: 22px;
    background: #16191f;
    border: 1px solid rgba(248,113,113,.5);
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.4;
    color: #f87171;
    overflow: hidden;
  }

  /* ---- setup ---- */
  .setup {
    position: fixed;
    inset: 0;
    padding: 22px;
    box-sizing: border-box;
    background: #0b0d10;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
    z-index: 10;
    overflow: auto;
  }
  .setup h1 { font-size: 21px; margin: 0; font-weight: 700; }
  .setup p { font-size: 14px; line-height: 1.45; color: #98a1b0; margin: 0; }
  .setup label { font-size: 13px; color: #98a1b0; }
  .setup input, .setup textarea {
    width: 100%;
    box-sizing: border-box;
    background: #16191f;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 12px;
    color: #f2f4f7;
    font-family: inherit;
    font-size: 16px;
    padding: 12px;
  }
  .setup textarea { height: 92px; resize: none; word-break: break-all; }
  .setup button {
    height: 56px;
    border: 0;
    border-radius: 14px;
    background: #ffb74a;
    color: #0b0d10;
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
  }
  .setup .err { color: #f87171; font-size: 13px; min-height: 17px; }

  /* ---- ?stats=1 ---- */
  .stats {
    position: fixed;
    left: 6px; top: 6px;
    z-index: 6;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: #8ddba4;
    background: rgba(0,0,0,.55);
    border-radius: 6px;
    padding: 3px 6px;
    pointer-events: none;
    white-space: pre;
  }
</style>
</head>
<body>

<div class="pager" id="pager"></div>
<div class="dots" id="dots"></div>
<div class="conn" id="conn"></div>

<script src="../dist/nspanel-cards.js"></script>
<script src="./icons.js"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
