<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NSPanel Cards — preview bench</title>
<style>
  html, body {
    margin: 0;
    background: #05070a;
    font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #98a1b0;
  }
  .rack {
    display: flex;
    flex-wrap: wrap;
    gap: 28px;
    padding: 28px;
    align-items: flex-start;
    width: max-content;
  }
  /* 480x480 is the Pro 86's physical panel. The bench pins CSS pixels to
     physical ones so what you see here is what fits on the glass. */
  .panel {
    width: 480px;
    height: 480px;
    background: #0b0d10;
    border-radius: 18px;
    padding: 12px;
    overflow: hidden;
    position: relative;   /* sheetHost anchors to this */
    box-sizing: border-box;
  }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-size: 13px; padding: 10px 2px 0; letter-spacing: .02em; }

  /* ?shot=<id> renders one bare 480x480 screen and nothing else, so a headless
     Chromium at --window-size=480,480 captures the glass 1:1. See dev/shots.ps1. */
  body.shot { background: #0b0d10; }
  body.shot .rack { padding: 0; gap: 0; }
  body.shot .cap { display: none; }
  body.shot .panel { border-radius: 0; }
</style>
</head>
<body>

<div class="rack">
  <div>
    <div class="panel" id="p-light"><div class="stack" id="s-light"></div></div>
    <div class="cap">Lights</div>
  </div>
  <div>
    <div class="panel" id="p-cover"><div class="stack" id="s-cover"></div></div>
    <div class="cap">Covers</div>
  </div>
  <div>
    <div class="panel" id="p-sheet"><div class="stack" id="s-sheet"></div></div>
    <div class="cap">Long-press</div>
  </div>
  <div>
    <div class="panel" id="p-climate"><div class="stack" id="s-climate"></div></div>
    <div class="cap">Climate</div>
  </div>
  <div>
    <div class="panel" id="p-media"><div class="stack" id="s-media"></div></div>
    <div class="cap">Media</div>
  </div>
  <div>
    <div class="panel" id="p-info"><div class="stack" id="s-info"></div></div>
    <div class="cap">Sensors</div>
  </div>
  <div>
    <div class="panel" id="p-scenes"><div class="stack" id="s-scenes"></div></div>
    <div class="cap">Buttons</div>
  </div>
  <div>
    <div class="panel" id="p-status"><div class="stack" id="s-status"></div></div>
    <div class="cap">Status</div>
  </div>
  <div>
    <div class="panel" id="p-sky"><div class="stack" id="s-sky"></div></div>
    <div class="cap">Weather & clock</div>
  </div>
</div>

<!-- the shipped bundle, loaded exactly as HA loads it -->
<script src="../dist/nspanel-cards.js"></script>
<script src="./mdi-icons.js"></script>

<script>
/* ------------------------------------------------------------------ *
 * ha-icon stub. Home Assistant supplies this element; outside HA the
 * cards would render an empty box. Path data comes from mdi-icons.js,
 * vendored so the bench and the screenshot script work offline.
 * ------------------------------------------------------------------ */
class HaIcon extends HTMLElement {
  static get observedAttributes() { return ['icon']; }
  connectedCallback() { this._paint(); }
  attributeChangedCallback() { this._paint(); }
  _paint() {
    const name = (this.getAttribute('icon') || '').replace('mdi:', '');
    if (!name || name === this._shown) return;
    this._shown = name;
    const d = window.MDI_PATHS[name];
    if (!d) { console.warn('bench: no vendored icon for', name); return; }
    const size = getComputedStyle(this).getPropertyValue('--mdc-icon-size').trim() || '24px';
    this.style.display = 'inline-flex';
    this.style.width = size;
    this.style.height = size;
    this.innerHTML =
      '<svg viewBox="0 0 24 24" style="width:100%;height:100%;fill:currentColor">' +
      '<path d="' + d + '"></path></svg>';
  }
}
customElements.define('ha-icon', HaIcon);

/* ------------------------------------------------------------------ *
 * Mock hass. The cards only ever touch states + callService (and, for
 * the weather forecast, connection - absent here on purpose, so the
 * bench exercises the attribute fallback path).
 *
 * The friendly_names are deliberately the raw ones Home Assistant tends
 * to generate from the device - which is what the cards' `title` option
 * is for, and what the configs below override.
 * ------------------------------------------------------------------ */
function st(entity_id, state, attributes) {
  return { entity_id, state, attributes: attributes || {} };
}

const hass = {
  states: {
    // rgb_color is what HA reports for a colour-temp light too, computed from
    // the kelvin - so this is a 2700K warm white, not a "colour" bulb.
    'light.dining_lights': st('light.dining_lights', 'on',
      { friendly_name: 'Shelly Dimmer 2 Dining', brightness: 173,
        color_mode: 'color_temp', color_temp_kelvin: 2700,
        rgb_color: [255, 169, 87] }),
    'light.lounge_lamp': st('light.lounge_lamp', 'on',
      { friendly_name: 'Hue Lounge Lamp', brightness: 120,
        color_mode: 'hs', rgb_color: [120, 96, 255] }),
    'light.kitchen_spots': st('light.kitchen_spots', 'off',
      { friendly_name: 'Kitchen Spots Relay' }),

    'cover.blinds_living_room': st('cover.blinds_living_room', 'open',
      { friendly_name: 'Somfy Living Room Roller', current_position: 62,
        supported_features: 15 }),
    'cover.bedroom_blackout': st('cover.bedroom_blackout', 'closed',
      { friendly_name: 'Bedroom Roller 2', current_position: 0,
        supported_features: 15 }),

    'climate.living_room': st('climate.living_room', 'heat',
      { friendly_name: 'Living Room TRV', current_temperature: 20.4, temperature: 21.5,
        min_temp: 7, max_temp: 30, hvac_action: 'heating',
        hvac_modes: ['off', 'heat', 'auto'] }),

    'sensor.living_co2': st('sensor.living_co2', '968',
      { friendly_name: 'Netatmo Living CO2', unit_of_measurement: 'ppm',
        device_class: 'carbon_dioxide' }),
    'sensor.living_temp': st('sensor.living_temp', '20.4',
      { friendly_name: 'Netatmo Living Temperature', unit_of_measurement: '°C',
        device_class: 'temperature' }),
    'sensor.living_hum': st('sensor.living_hum', '48',
      { friendly_name: 'Humidity', unit_of_measurement: '%', device_class: 'humidity' }),

    'sensor.outside_temp': st('sensor.outside_temp', '12.4',
      { friendly_name: 'Outside Temperature', unit_of_measurement: '°C',
        device_class: 'temperature' }),
    'sensor.outside_hum': st('sensor.outside_hum', '78',
      { friendly_name: 'Outside Humidity', unit_of_measurement: '%',
        device_class: 'humidity' }),
    'sensor.wind': st('sensor.wind', '11',
      { friendly_name: 'Wind Speed', unit_of_measurement: 'km/h',
        device_class: 'wind_speed' }),

    'binary_sensor.front_door': st('binary_sensor.front_door', 'off',
      { friendly_name: 'Front Door Contact', device_class: 'door' }),
    'binary_sensor.back_door': st('binary_sensor.back_door', 'on',
      { friendly_name: 'Back Door Contact', device_class: 'door' }),
    'binary_sensor.kitchen_window': st('binary_sensor.kitchen_window', 'off',
      { friendly_name: 'Kitchen Window Contact', device_class: 'window' }),
    'binary_sensor.leak_kitchen': st('binary_sensor.leak_kitchen', 'off',
      { friendly_name: 'Kitchen Leak Sensor', device_class: 'moisture' }),
    'lock.front_door': st('lock.front_door', 'locked',
      { friendly_name: 'Front Door Lock' }),
    'cover.garage': st('cover.garage', 'closed',
      { friendly_name: 'Garage Door', current_position: 0 }),

    'weather.home': st('weather.home', 'partlycloudy',
      { friendly_name: 'Forecast Home', temperature: 14, temperature_unit: '°C',
        humidity: 71, wind_speed: 11, wind_speed_unit: 'km/h',
        forecast: [
          { datetime: '2026-03-05T12:00:00+00:00', condition: 'partlycloudy',
            temperature: 14, templow: 7 },
          { datetime: '2026-03-06T12:00:00+00:00', condition: 'rainy',
            temperature: 11, templow: 6 },
          { datetime: '2026-03-07T12:00:00+00:00', condition: 'pouring',
            temperature: 9, templow: 5 },
          { datetime: '2026-03-08T12:00:00+00:00', condition: 'sunny',
            temperature: 13, templow: 4 },
        ] }),

    'media_player.kitchen': st('media_player.kitchen', 'playing',
      { friendly_name: 'Sonos Kitchen', volume_level: 0.34,
        media_title: 'Sunlight Through Glass', media_artist: 'Hale & Ivor',
        media_album_name: 'Long Afternoons',
        // an abstract placeholder, not the artwork of any real release
        entity_picture: 'data:image/svg+xml;utf8,' + encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">' +
          '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
          '<stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f0a03c"/>' +
          '</linearGradient></defs><rect width="160" height="160" fill="url(#g)"/>' +
          '<circle cx="112" cy="48" r="26" fill="rgba(255,255,255,.35)"/></svg>'),
        supported_features: 1 | 4 | 16 | 32 | 4096 | 16384 }),

    'script.goodnight': st('script.goodnight', 'off', { friendly_name: 'Goodnight' }),
    'script.good_morning': st('script.good_morning', 'off',
      { friendly_name: 'Good morning' }),
    'scene.movie': st('scene.movie', 'unknown', { friendly_name: 'Movie' }),
    'script.leaving': st('script.leaving', 'on',          // mid-run, so it reads as active
      { friendly_name: 'Leaving' }),

    'calendar.family': st('calendar.family', 'on',
      { friendly_name: 'Family', message: 'Bin day · 07:30' }),
  },
  callService(domain, service, data) {
    console.log('callService', domain + '.' + service, data);
  },
};

function card(type, config, mount) {
  const el = document.createElement(type);
  el.setConfig(config);
  el.hass = hass;
  mount.appendChild(el);
  return el;
}

/* These configs are the ones printed in the README, verbatim, so the
   screenshots are pictures of the documented YAML. 260 + 184 + the 12px gap
   fills a 480px panel exactly. */
card('nspanel-light-card', {
  entity: 'light.dining_lights', title: 'Dining table', height: 260,
  presets: [
    { name: 'Low', brightness_pct: 15 },
    { name: 'Dinner', brightness_pct: 45, color_temp_kelvin: 2400 },
    { name: 'Full', brightness_pct: 100 },
  ],
}, document.getElementById('s-light'));

card('nspanel-light-card', {
  entity: 'light.lounge_lamp', title: 'Lounge lamp',
  height: 184, show_presets: false,
}, document.getElementById('s-light'));

card('nspanel-cover-card', {
  entity: 'cover.blinds_living_room', title: 'Living room blinds', height: 260,
  presets: [
    { name: 'Open', position: 100 },
    { name: 'Privacy', position: 35 },
    { name: 'Shut', position: 0 },
  ],
}, document.getElementById('s-cover'));

card('nspanel-cover-card', {
  entity: 'cover.bedroom_blackout', title: 'Bedroom blackout',
  height: 184, show_presets: false,
}, document.getElementById('s-cover'));

/* third panel: the same light card, with the long-press sheet opened over it */
const sheetCard = card('nspanel-light-card', {
  entity: 'light.dining_lights', title: 'Dining table', height: 260,
  presets: [
    { name: 'Low', brightness_pct: 15 },
    { name: 'Dinner', brightness_pct: 45, color_temp_kelvin: 2400 },
    { name: 'Full', brightness_pct: 100 },
  ],
}, document.getElementById('s-sheet'));
card('nspanel-light-card', {
  entity: 'light.kitchen_spots', title: 'Kitchen spots',
  height: 184, show_presets: false,
}, document.getElementById('s-sheet'));

/* climate + a strip underneath: 300 + 144 fills the panel */
card('nspanel-climate-card', {
  entity: 'climate.living_room', title: 'Living room', height: 300,
  presets: [
    { name: 'Eco', temperature: 17 },
    { name: 'Day', temperature: 20.5 },
    { name: 'Warm', temperature: 22 },
  ],
}, document.getElementById('s-climate'));

card('nspanel-sensors-card', {
  title: 'Outside', height: 144,
  entities: [
    { entity: 'sensor.outside_temp', name: 'Outside' },
    { entity: 'sensor.outside_hum', name: 'Humidity' },
    { entity: 'sensor.wind', name: 'Wind' },
  ],
}, document.getElementById('s-climate'));

card('nspanel-media-card', {
  entity: 'media_player.kitchen', title: 'Kitchen', height: 300,
  presets: [
    { name: 'Radio 4', source: 'BBC Radio 4' },
    { name: 'Jazz', source: 'Jazz24' },
    { name: 'Quiet', volume_pct: 15 },
  ],
}, document.getElementById('s-media'));

card('nspanel-sensors-card', {
  title: 'Outside', height: 144,
  entities: [
    { entity: 'sensor.outside_temp', name: 'Outside' },
    { entity: 'sensor.outside_hum', name: 'Humidity' },
    { entity: 'sensor.wind', name: 'Wind' },
  ],
}, document.getElementById('s-media'));

/* two sensor cards: one with a range bar and severity, one with a second line */
card('nspanel-sensor-card', {
  entity: 'sensor.living_co2', title: 'Living room CO₂', height: 222,
  min: 400, max: 1600,
  severity: [
    { above: 800, color: '#f0a03c' },
    { above: 1200, color: '#f87171' },
  ],
}, document.getElementById('s-info'));

card('nspanel-sensor-card', {
  entity: 'sensor.living_temp', title: 'Living room', height: 222,
  secondary: 'sensor.living_hum',
}, document.getElementById('s-info'));

card('nspanel-button-card', {
  height: 300, columns: 2,
  buttons: [
    { entity: 'script.goodnight', name: 'Goodnight', icon: 'mdi:weather-night',
      confirm: true },
    { entity: 'script.good_morning', name: 'Good morning', icon: 'mdi:weather-sunset' },
    { entity: 'scene.movie', name: 'Movie', icon: 'mdi:sofa-outline' },
    { entity: 'script.leaving', name: 'Leaving', icon: 'mdi:lock' },
  ],
}, document.getElementById('s-scenes'));

card('nspanel-button-card', {
  height: 144, columns: 3,
  buttons: [
    { entity: 'script.goodnight', name: 'Night', icon: 'mdi:weather-night' },
    { entity: 'scene.movie', name: 'Movie', icon: 'mdi:sofa-outline' },
    { entity: 'script.leaving', name: 'Leaving', icon: 'mdi:lock' },
  ],
}, document.getElementById('s-scenes'));

card('nspanel-status-card', {
  title: 'House', height: 444,
  entities: [
    'binary_sensor.front_door',
    { entity: 'binary_sensor.back_door', name: 'Back door' },
    'binary_sensor.kitchen_window',
    { entity: 'binary_sensor.leak_kitchen', name: 'Kitchen leak' },
    { entity: 'lock.front_door', name: 'Front lock' },
    { entity: 'cover.garage', name: 'Garage' },
  ],
}, document.getElementById('s-status'));

card('nspanel-weather-card', {
  entity: 'weather.home', title: 'Amsterdam', height: 288,
}, document.getElementById('s-sky'));

card('nspanel-clock-card', {
  height: 156, show_date: true, entity: 'calendar.family',
}, document.getElementById('s-sky'));

/* Keep the sheet inside the simulated panel instead of over the whole page. */
window.NsPanelCards.sheetHost = document.getElementById('p-sheet');

window.openSheet = () => sheetCard._openSheet();

/* ---- capture mode ---- */
const shot = new URLSearchParams(location.search).get('shot');
if (shot) {
  document.body.classList.add('shot');
  document.querySelectorAll('.rack > div').forEach((w) => {
    if (!w.querySelector('#p-' + shot)) w.remove();
  });
}
if (!shot || shot === 'sheet') {
  window.addEventListener('load', () => setTimeout(() => window.openSheet(), 150));
}
</script>
</body>
</html>
