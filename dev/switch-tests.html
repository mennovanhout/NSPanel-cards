<!doctype html>
<meta charset="utf-8">
<title>Switch detail target regression tests</title>
<style>body{margin:0;background:#0b0d10;color:white;font:16px sans-serif}#fixture{width:480px}#result{white-space:pre-wrap}</style>
<div id="fixture"></div><pre id="result">Running</pre>
<script src="../dist/nspanel-cards.js"></script>
<script>
// Fake HA only: commands and more-info events stay in this page.
if (!customElements.get('ha-icon')) customElements.define('ha-icon', class extends HTMLElement {});
const fixture = document.querySelector('#fixture');
const calls = [], opened = [], results = [];
const assert = (ok, message) => { if (!ok) throw new Error(message); };
let card;
const pause = () => new Promise((resolve) => setTimeout(() => {
  if (card && card._raf !== null) {
    cancelAnimationFrame(card._raf); card._raf = null; card._render();
  }
  resolve();
}, 30));
async function mount(config) {
  fixture.replaceChildren(); calls.length = 0; opened.length = 0;
  card = document.createElement('nspanel-switch-card');
  card.setConfig({haptics: false, ...config});
  card.addEventListener('hass-more-info', (e) => opened.push(e.detail.entityId));
  fixture.append(card);
  card.hass = {states: {
    'switch.primary': {entity_id:'switch.primary', state:'off', attributes:{}},
    'input_boolean.secondary': {entity_id:'input_boolean.secondary', state:'on', attributes:{}},
  }, callService: (domain, service, data) => {calls.push({domain, service, data}); return Promise.resolve();}};
  await pause();
}
function hold(index = 0) {
  card.shadowRoot.querySelectorAll('.btn')[index].dispatchEvent(
    new MouseEvent('contextmenu', {bubbles:true, cancelable:true}));
}
function pointer(button, kind, x = 20, y = 20) {
  button.dispatchEvent(new PointerEvent(kind, {
    bubbles:true, pointerId:1, isPrimary:true, button:0, clientX:x, clientY:y,
  }));
}
function tap(button) {
  pointer(button, 'pointerdown'); pointer(button, 'pointerup');
  button.dispatchEvent(new MouseEvent('click', {bubbles:true, detail:1}));
}
async function longPress(button) {
  pointer(button, 'pointerdown');
  await new Promise((resolve) => setTimeout(resolve, 550));
  pointer(button, 'pointerup');
  button.dispatchEvent(new MouseEvent('click', {bubbles:true, detail:1}));
}
async function test(name, run) {
  try {await run(); results.push({name, passed:true});}
  catch (e) {results.push({name, passed:false, error:e.message});}
}
async function run() {
  await test('shorthand hold uses trimmed target; tap and state keep primary', async () => {
    await mount({entity:'switch.primary', detail_entity:' light.detail '});
    hold();
    assert(opened.join() === 'light.detail' && !calls.length, 'hold routing or no-service contract failed');
    const button = card.shadowRoot.querySelector('.btn');
    assert(button.querySelector('.st').textContent === 'Off', 'state does not reflect primary');
    button.click();
    assert(calls.length === 1 && calls[0].domain === 'homeassistant' && calls[0].service === 'turn_on' && calls[0].data.entity_id === 'switch.primary', 'tap redirected');
  });
  await test('grid detail targets are per entry; top-level target is shorthand only', async () => {
    await mount({detail_entity:'sensor.ignored', switches:[
      {entity:'switch.primary', detail_entity:'light.detail'},
      {entity:'input_boolean.secondary', detail_entity:'sensor.detail'},
    ]});
    hold(0); hold(1);
    assert(opened.join() === 'light.detail,sensor.detail' && !calls.length, 'grid targets not independent');
    card.shadowRoot.querySelectorAll('.btn')[1].click();
    assert(calls[0].data.entity_id === 'input_boolean.secondary' && calls[0].service === 'turn_off', 'secondary tap redirected');
  });
  for (const target of [undefined, '', '   ', 12]) await test(`default target (${JSON.stringify(target)})`, async () => {
    await mount({entity:'switch.primary', detail_entity:target}); hold();
    assert(opened.join() === 'switch.primary' && !calls.length, 'invalid optional target did not fall back');
  });
  await test('more_info false disables details while keeping short tap', async () => {
    await mount({entity:'switch.primary', detail_entity:'light.detail', more_info:false}); hold();
    assert(!opened.length && !calls.length, 'disabled hold acted');
    card.shadowRoot.querySelector('.btn').click();
    assert(calls.length === 1 && calls[0].data.entity_id === 'switch.primary', 'short tap lost');
  });
  await test('reconfigured target is used without retaining old handler', async () => {
    await mount({entity:'switch.primary', detail_entity:'light.first'});
    card.setConfig({entity:'switch.primary', detail_entity:'sensor.second', haptics:false});
    await pause(); hold();
    assert(opened.join() === 'sensor.second' && !calls.length, 'stale target after config change');
  });
  await test('visual editor exposes both forms and retains them on edit', () => {
    assert(SWITCH_SCHEMA.some((r) => r.name === 'detail_entity'), 'missing shorthand field');
    const list = SWITCH_SCHEMA.find((r) => r.name === 'switches');
    assert(list.selector.object.fields.detail_entity, 'missing item field');
    const editor = customElements.get('nspanel-switch-card').getConfigElement();
    editor.setConfig({type:'custom:nspanel-switch-card', entity:'switch.primary', detail_entity:'light.detail', switches:[{entity:'switch.primary', detail_entity:'sensor.detail'}]});
    editor._valueChanged({stopPropagation() {}, detail: {value: {title: 'Updated'}}});
    assert(editor._config.title === 'Updated', 'editor change was not applied');
    assert(editor._config.detail_entity === 'light.detail' && editor._config.switches[0].detail_entity === 'sensor.detail', 'editor dropped target');
  });
  await test('swapped switch tap opens detail once; hold powers primary once', async () => {
    await mount({entity:'switch.primary', detail_entity:' light.detail ', swap_press_actions:true});
    const button = card.shadowRoot.querySelector('.btn');
    tap(button);
    assert(opened.join() === 'light.detail' && !calls.length, 'swapped tap did not open only detail');
    opened.length = 0;
    pointer(button, 'pointerdown');
    await new Promise((resolve) => setTimeout(resolve, 550));
    pointer(button, 'pointerup');
    button.dispatchEvent(new MouseEvent('click', {bubbles:true, detail:1}));
    button.dispatchEvent(new MouseEvent('contextmenu', {bubbles:true, cancelable:true}));
    assert(!opened.length && calls.length === 1 && calls[0].data.entity_id === 'switch.primary', 'hold fired twice or changed target');
  });
  await test('item override chooses tap and hold independently', async () => {
    await mount({swap_press_actions:true, switches:[
      {entity:'switch.primary', detail_entity:'light.detail', swap_press_actions:false},
      {entity:'input_boolean.secondary', detail_entity:'sensor.detail'},
    ]});
    const buttons = card.shadowRoot.querySelectorAll('.btn');
    tap(buttons[0]); tap(buttons[1]);
    assert(calls.length === 1 && calls[0].data.entity_id === 'switch.primary', 'false override did not power');
    assert(opened.join() === 'sensor.detail', 'inherited swap did not open detail');
    await longPress(buttons[0]);
    assert(opened.join() === 'sensor.detail,light.detail', 'false override hold did not open detail');
  });
  await test('swapped detail can be disabled without losing power', async () => {
    await mount({entity:'switch.primary', more_info:false, swap_press_actions:true});
    const button = card.shadowRoot.querySelector('.btn');
    tap(button); await longPress(button);
    assert(!opened.length && calls.length === 1, 'disabled detail or swapped power failed');
  });
  await test('swipe cancellation and unavailable switch send no commands', async () => {
    await mount({entity:'switch.primary', swap_press_actions:true});
    const button = card.shadowRoot.querySelector('.btn');
    pointer(button, 'pointerdown'); pointer(button, 'pointermove', 50, 20);
    pointer(button, 'pointerup', 50, 20);
    button.dispatchEvent(new MouseEvent('click', {bubbles:true, detail:1}));
    assert(!opened.length && !calls.length, 'swipe was treated as tap');
    card.hass = {states:{'switch.primary':{entity_id:'switch.primary',state:'unavailable',attributes:{}}}, callService:(...args) => calls.push(args)};
    await pause();
    tap(card.shadowRoot.querySelector('.btn'));
    assert(!opened.length && !calls.length, 'unavailable switch acted');
  });
  await test('swapped light tap and hold use their configured actions', async () => {
    fixture.replaceChildren(); calls.length = 0;
    const light = document.createElement('nspanel-light-card');
    light.setConfig({entity:'light.test', swap_press_actions:true, long_press_ms:30, haptics:false});
    fixture.append(light);
    light.hass = {states:{'light.test':{entity_id:'light.test',state:'off',attributes:{supported_color_modes:['onoff']}}}, callService:(domain, service, data) => calls.push({domain, service, data})};
    let sheets = 0;
    light._openSheet = () => { sheets++; };
    const event = (kind) => ({pointerId:1, button:0, clientX:20, clientY:20});
    light._onDown(event('down')); light._onUp(event('up'));
    assert(sheets === 1 && !calls.length, 'swapped light tap did not open detail');
    light._onDown(event('down'));
    await new Promise((resolve) => setTimeout(resolve, 60));
    light._onUp(event('up'));
    assert(sheets === 1 && calls.length === 1 && calls[0].service === 'toggle', 'swapped light hold did not toggle once');
    light.setConfig({entity:'light.test', swap_press_actions:true, long_press:'none', long_press_ms:30, haptics:false});
    light._onDown(event('down')); light._onUp(event('up'));
    assert(sheets === 1 && calls.length === 1, 'disabled light detail acted');
    light._onDown(event('down')); light._onCancel(); light._onUp(event('up'));
    assert(calls.length === 1, 'cancelled light press acted');
    light.hass = {states:{'light.test':{entity_id:'light.test',state:'unavailable',attributes:{}}}, callService:(...args) => calls.push(args)};
    light._onDown(event('down')); light._onUp(event('up'));
    assert(calls.length === 1, 'unavailable light acted');
  });
  await test('editor exposes swap at card and switch item level', () => {
    assert(LIGHT_SCHEMA.some((r) => r.name === 'swap_press_actions'), 'light field missing');
    assert(SWITCH_SCHEMA.some((r) => r.name === 'swap_press_actions'), 'switch field missing');
    const list = SWITCH_SCHEMA.find((r) => r.name === 'switches');
    assert(list.selector.object.fields.swap_press_actions, 'switch item field missing');
  });
  document.querySelector('#result').textContent = JSON.stringify(results, null, 2);
  document.documentElement.dataset.testStatus = results.every((r) => r.passed) ? 'passed' : 'failed';
}
run().catch((e) => {
  document.documentElement.dataset.testStatus = 'failed';
  document.querySelector('#result').textContent = e.stack;
});
</script>
